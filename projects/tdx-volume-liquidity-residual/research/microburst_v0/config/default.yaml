# MBV V0.1 Frozen Default Configuration
version: "0.1.0"
study_mode: "SYNTHETIC_DEMO"  # Must be SYNTHETIC_DEMO unless verified real data + exchange calendar are provided

data_contract:
  timezone: "Asia/Shanghai"
  frequency: "5min"           # "5min" (primary, 48 slots) or "1min" (sensitivity, 240 slots)
  timestamp_semantics: "bar_start"  # "bar_start" or "bar_end"
  volume_unit: "share"        # "share" or "lot_100" (normalized to shares)
  amount_unit: "cny"          # "cny" or "cny_10k" (normalized to CNY)
  adjustment: "unadjusted"    # "unadjusted", "qfq", "hfq"
  exclude_closing_auction: false  # Set true for 1min 14:57-15:00 sensitivity exclusion
  min_slot_coverage: 0.95     # Daily valid slot coverage gate (>= 0.95)
  reconciliation_tol: 0.02    # Relative tolerance for minute vs daily volume reconciliation flag

baseline:
  method: "tod_median"        # "tod_median" (primary past-only) or "session_ema" (benchmark only)
  lookback_days: 20           # Completed prior trading sessions per (symbol, slot)
  min_history_days: 15        # Minimum completed positive-volume history days per slot
  session_ema_span: 20        # Used only when method == "session_ema"

burst:
  rel_vol_threshold: 2.5      # R_{t,k} >= 2.5
  body_eff_threshold: 0.10    # |E_{t,k}| >= 0.10
  tick_size: 0.01             # Minimum range denominator max(H - L, tick_size)
  ratio_cap_multiple: 10.0    # Weight outlier cap min(R_{t,k} / 2.5, 10.0)
  dir_day_eps: 1.0e-6         # |B0_DIR| <= eps yields NaN burst_direction_agreement

vlr_b0:
  model: "B0"                 # Frozen VLR V2.1.2 baseline model (read-only)
  initial_tr: "hl"            # Follows repository replica default

event_study:
  horizons: [1, 3, 5, 10, 20]
  min_events_per_group: 5     # Below this -> INCONCLUSIVE
  rvol_buckets: [0.0, 1.2, 1.5, 2.2, 3.0, 100.0]
  mbv_share_cut: 0.15         # Pre-registered burst_share cutpoint
  mbv_dominance_cut: 0.25     # Pre-registered burst_dominance cutpoint
  mbv_abs_dom_weak_cut: 0.25  # For H2 ABU offsetting/weak dominance subgroup
  bootstrap_blocks: [5, 10, 20]
  bootstrap_repetitions: 500
  bootstrap_seed: 20261013
  confidence: 0.95
